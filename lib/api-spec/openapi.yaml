      type: object
      required: [date, eggs]
      properties:
        date:
          type: string
        eggs:
          type: number
    FarmTaskInput:
      type: object
      required: [intervalValue, intervalUnit, reminderTime]
      properties:
        actionType:
          description: Without it, the action follows from the title.
          oneOf:
            - $ref: "#/components/schemas/FarmTaskAction"
            - type: 'null'
        title:
          type: [string, 'null']
          maxLength: 80
        area:
          oneOf:
            - $ref: "#/components/schemas/FarmTaskArea"
