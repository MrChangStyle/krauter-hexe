      summary: List all accounts that have ever signed in (owner only)
      responses:
        "200":
          description: All accounts, owner first, then by sign-up date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
  /users/orphaned-data:
    get:
      tags: [users]
      operationId: getOrphanedData
      summary: Count data left behind by deleted accounts (owner only)
      description: >
        Counts rows that point at an account which no longer exists – left
        behind when removing an account only deleted the users row. Changes
        nothing.
      responses:
        "200":
          description: Rows per table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedDataReport"
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
