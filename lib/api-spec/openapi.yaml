    post:
      tags: [users]
      operationId: cleanupOrphanedData
      summary: Remove data left behind by deleted accounts (owner only)
      description: >
        Deletes personal rows of accounts that no longer exist and unlinks
        their shared archive entries (which stay), in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupOrphanedDataInput"
      responses:
        "200":
          description: Rows removed (personal tables) or unlinked (plants, insects)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedDataReport"
        "400":
          description: Missing confirmation
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUserApproval
      summary: Approve or revoke an account (owner only)
      description: >
        Grants or revokes app access for an account. Revoking also deletes
        all sessions of that account so it is signed out everywhere. The
        owner account cannot be modified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserApprovalInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Invalid body or attempt to modify the owner account
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
        "404":
          description: Account not found
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Remove an account and all its sessions (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Attempt to remove the owner account
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
        "404":
          description: Account not found
