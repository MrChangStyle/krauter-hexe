        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: bedId
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BedPlantingInput"
      responses:
        "201":
          description: The planting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedPlanting"
        "400":
          description: Unknown plant or no room.
        "409":
          description: The cells are taken.
  /farms/{farmId}/plantings/{plantingId}:
    delete:
      tags: [garden]
      operationId: removePlanting
      summary: Take a planting out of the grid (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: plantingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed.
  /farms/{farmId}/plantings/{plantingId}/checks/{kind}:
    put:
      tags: [garden]
      operationId: checkGardenEvent
      summary: Tick off a date of a planting (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: plantingId
          in: path
          required: true
          schema:
            type: integer
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GardenEventKind"
      responses:
        "204":
          description: Ticked off.
        "400":
          description: The plant has no such date.
    delete:
      tags: [garden]
      operationId: uncheckGardenEvent
      summary: Undo a ticked-off date (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: plantingId
          in: path
          required: true
          schema:
            type: integer
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/GardenEventKind"
      responses:
        "204":
          description: Undone.
  /farms/{farmId}/beds/{bedId}/history:
    get:
      tags: [garden]
      operationId: getBedHistory
      summary: Plantings of a bed over all seasons, newest first (crop rotation)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: bedId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The plantings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BedPlanting"
  /farms/{farmId}/garden/seasons/{season}/calendar:
    get:
      tags: [garden]
      operationId: getGardenCalendar
      summary: Sowing, planting and harvest dates of all plantings of a season, from the crop data and the frost dates
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The dates, sorted by start.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GardenCalendarEntry"
  /farms/{farmId}/garden/goals:
    get:
      tags: [garden]
      operationId: getGardenGoals
      summary: Goals of the Garten-Assistent (defaults until saved)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The goals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenGoals"
    put:
      tags: [garden]
      operationId: saveGardenGoals
      summary: Save the goals (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GardenGoals"
      responses:
        "200":
          description: The saved goals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenGoals"
        "400":
          description: Out of range.
  /farms/{farmId}/garden/plan:
    get:
      tags: [garden]
      operationId: getGardenPlan
      summary: Garten-Assistent – needs of people and animals and the split onto the beds (fixed rules of thumb)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenPlan"
  /farms/{farmId}/garden/seasons/{season}/harvests:
    get:
      tags: [garden]
      operationId: listHarvests
      summary: Harvests of a season, newest first
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The harvests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Harvest"
  /farms/{farmId}/plantings/{plantingId}/harvests:
    post:
      tags: [garden]
      operationId: addHarvest
      summary: Log a harvest of a planting (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: plantingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarvestInput"
      responses:
        "201":
          description: The harvest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Harvest"
        "400":
          description: Date or amount out of range.
  /farms/{farmId}/harvests/{harvestId}:
    delete:
      tags: [garden]
      operationId: removeHarvest
      summary: Delete a logged harvest (caretaker or admin)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
        - name: harvestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted.
  /farms/{farmId}/garden/frost-warnings:
    get:
      tags: [garden]
      operationId: getFrostWarnings
      summary: Beds where frost-tender plants meet a frosty night (DWD forecast via Bright Sky)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The warnings for the coming night (empty when there is none or no forecast).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrostWarning"
  /farms/{farmId}:
    patch:
      tags: [farm]
      operationId: renameFarm
      summary: Rename a farm (admin only)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmNameInput"
      responses:
        "200":
          description: The renamed farm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummary"
    delete:
      tags: [farm]
      operationId: deleteFarm
      summary: Delete a farm with all its animals and records (admin only)
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteFarmInput"
      responses:
        "204":
          description: Deleted.
        "400":
          description: Confirmation name does not match.
    get:
      tags: [farm]
      operationId: getFarm
      summary: One farm the account is a member of
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The farm with the account's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummary"
        "404":
          description: No such farm – or the account is not a member (same answer on purpose).
  /reports:
    post:
      tags: [moderation]
      operationId: createReport
      summary: Report a shared photo or a username
      description: >
        Any approved account can report the shared photo of a plant or insect,
        or a username from the leaderboard. Reporting the same content again
        while the first report is open changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report filed (or already filed by this account).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid input, or reporting yourself.
        "404":
          description: The reported content does not exist.
        "429":
          description: Too many reports from this account today.
    get:
      tags: [moderation]
      operationId: listReports
      summary: Open reports, grouped by content (owner only)
      responses:
        "200":
          description: One entry per reported content, most reported first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportGroup"
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
  /reports/resolve:
    post:
      tags: [moderation]
      operationId: resolveReports
      summary: Act on all open reports of one content (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportsInput"
      responses:
        "200":
          description: Reports closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveReportsResult"
        "400":
          description: Action does not fit the content type, or targets the owner.
        "401":
          description: Not signed in
        "403":
          description: Signed in but not the owner
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get the leaves leaderboard (top 50 plus the caller's own entry)
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"
        "401":
          description: Not signed in
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [push]
      summary: Get the server's VAPID public key for push subscriptions
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
        "401":
          description: Not signed in
  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register this browser's push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "204":
          description: Subscription stored
        "400":
          description: Invalid input
        "401":
          description: Not signed in
  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove a stored push subscription by its endpoint URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeInput"
      responses:
        "204":
          description: Subscription removed (or was not stored)
        "400":
          description: Invalid input
        "401":
          description: Not signed in
  /push/test:
    post:
      operationId: sendTestPush
      tags: [push]
      summary: Send a test push notification to all of the user's devices
      responses:
        "200":
          description: Number of devices the test was sent to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResult"
        "401":
          description: Not signed in
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Signed session token — `Bearer <token>`.
      schema:
        type: string
    SessionCookie:
      name: auth
      in: cookie
      required: false
      description: Browser session cookie holding the signed token.
      schema:
        type: string
  schemas:
    FeedCategory:
      type: string
      enum: [roughage, fresh, grain, compound, vegetable, mineral]
    LifeStage:
      type: string
      enum: [maintenance, growth, laying, molt, pregnancy, lactation, winter]
    FeedValues:
      type: object
      description: Per kg dry matter; dryMatter is % as fed
      required: [dryMatter, crudeProtein, crudeFat, crudeFibre, calcium, phosphorus, copper]
      properties:
        dryMatter:
          type: number
        crudeProtein:
          type: number
          description: "% of dry matter"
        crudeFat:
          type: number
        crudeFibre:
          type: number
        calcium:
          type: number
          description: g per kg dry matter
        phosphorus:
          type: number
        copper:
          type: [number, 'null']
          description: mg per kg dry matter
    Feed:
      allOf:
        - $ref: "#/components/schemas/FeedValues"
        - type: object
          required: [key, name, category, forSpecies, botanicalName, hint]
          properties:
            key:
              type: string
            name:
              type: string
            category:
              $ref: "#/components/schemas/FeedCategory"
            forSpecies:
              type: [array, 'null']
              items:
                $ref: "#/components/schemas/FarmSpecies"
            botanicalName:
              type: [string, 'null']
            hint:
              type: [string, 'null']
    FeedReference:
      type: object
      required: [feeds, species]
      properties:
        feeds:
          type: array
          items:
            $ref: "#/components/schemas/Feed"
        species:
          type: array
          items:
            type: object
            required: [species, stages, hasNeeds]
            properties:
              species:
                $ref: "#/components/schemas/FarmSpecies"
              stages:
                type: array
                items:
                  $ref: "#/components/schemas/LifeStage"
              hasNeeds:
                type: boolean
    FarmFeed:
      type: object
      required: [id, name, category, values, forSpecies, botanicalName, additives]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: "#/components/schemas/FeedCategory"
        values:
          $ref: "#/components/schemas/FeedValues"
        forSpecies:
          type: [array, 'null']
          items:
            type: string
        botanicalName:
          type: [string, 'null']
        additives:
          type: [array, 'null']
          items:
            type: string
    FeedLabelReading:
      type: object
      description: What the AI read from a label (as fed). Missing or implausible values are null and must be typed in.
      required: [name, category, forSpecies, dryMatter, label, additives, ionophores]
      properties:
        name:
          type: [string, 'null']
        category:
          $ref: "#/components/schemas/FeedCategory"
        forSpecies:
          type: array
          items:
            $ref: "#/components/schemas/FarmSpecies"
        dryMatter:
          type: [number, 'null']
          description: "% – from moisture, only when printed"
        label:
          type: object
          required: [crudeProtein, crudeFat, crudeFibre, calcium, phosphorus, copper]
          properties:
            crudeProtein:
              type: [number, 'null']
            crudeFat:
              type: [number, 'null']
            crudeFibre:
              type: [number, 'null']
            calcium:
              type: [number, 'null']
            phosphorus:
              type: [number, 'null']
            copper:
              type: [number, 'null']
        additives:
          type: array
          items:
            type: string
        ionophores:
          type: array
          description: Coccidiostats found in the additives (Monensin & Co.) – deadly for horses
          items:
            type: string
    LabelValues:
      type: object
      description: As printed on the label (as fed) – crude nutrients, calcium and phosphorus in %, copper in mg/kg
      required: [crudeProtein, crudeFat, crudeFibre, calcium, phosphorus]
      properties:
        crudeProtein:
          type: number
        crudeFat:
          type: number
        crudeFibre:
          type: number
        calcium:
          type: number
        phosphorus:
          type: number
        copper:
          type: [number, 'null']
    FarmFeedInput:
      type: object
      required: [name, category, dryMatter, label]
      properties:
        name:
          type: string
          maxLength: 80
        category:
          $ref: "#/components/schemas/FeedCategory"
        dryMatter:
          type: number
          description: "% as fed (88 for dry feed)"
        label:
          $ref: "#/components/schemas/LabelValues"
        forSpecies:
          type: [array, 'null']
          items:
            $ref: "#/components/schemas/FarmSpecies"
        botanicalName:
          type: [string, 'null']
        additives:
          type: [array, 'null']
          maxItems: 30
          items:
            type: string
            maxLength: 120
    RationItem:
      type: object
      required: [grams]
      properties:
        feedKey:
          type: [string, 'null']
        feedId:
          type: [integer, 'null']
        grams:
          type: number
          description: As fed, per animal and day
    RationInput:
      type: object
      required: [stage, items, times]
      properties:
        animalId:
          type: [integer, 'null']
        herdId:
          type: [integer, 'null']
        stage:
          $ref: "#/components/schemas/LifeStage"
        items:
          type: array
          items:
            $ref: "#/components/schemas/RationItem"
        times:
          type: array
          items:
            type: string
            enum: [morgens, mittags, abends]
        waterL:
          type: [number, 'null']
        season:
          oneOf:
            - type: 'null'
            - $ref: "#/components/schemas/RationSeason"
        gradual:
          type: [boolean, 'null']
          description: Spread a change of feed over some days (default true)
    NutrientCheck:
      type: object
      required: [nutrient, value, min, max, status, severe, tip]
      properties:
        nutrient:
          type: string
          enum: [amount, crudeProtein, crudeFibre, calcium, phosphorus, copper]
        value:
          type: number
        min:
          type: number
        max:
          type: number
        status:
          type: string
          enum: [ok, low, high]
        severe:
          type: boolean
        tip:
          type: [string, 'null']
    FeedWarning:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [toxic, foreignMineral, copper, ionophore, withdrawal]
        text:
          type: string
    RationSeason:
      type: string
      enum: [all, summer, winter]
      description: all year, summer (April–October) or winter (November–March)
    FeedRemindersResult:
      type: object
      required: [created, updated, paused]
      properties:
        created:
          type: integer
        updated:
          type: integer
        paused:
          type: integer
    FeedTransition:
      type: object
      description: A change of feed spread over some days – today's mixture of the old and the new ration
      required: [reason, toSeason, startedOn, endsOn, days, day, newShare, phases, items]
      properties:
        reason:
          type: string
          enum: [change, season]
        toSeason:
          oneOf:
            - type: 'null'
            - $ref: "#/components/schemas/RationSeason"
        startedOn:
          type: string
          description: YYYY-MM-DD
        endsOn:
          type: string
          description: YYYY-MM-DD
        days:
          type: integer
        day:
          type: integer
          description: 1-based day of the change today; 0 = starts later
        newShare:
          type: number
        phases:
          type: array
          items:
            type: object
            required: [fromDay, toDay, newShare]
            properties:
              fromDay:
                type: integer
              toDay:
                type: integer
              newShare:
                type: number
        items:
          type: array
          items:
            type: object
            required: [name, grams]
            properties:
              name:
                type: string
              grams:
                type: number
    RationEvaluation:
      type: object
      required: [id, target, season, active, stage, items, times, waterL, need, values, checks, warnings, transition, hints, group, updatedAt]
      properties:
        id:
          type: integer
        target:
          type: object
          required: [kind, id, name, species, count]
          properties:
            kind:
              type: string
              enum: [animal, herd]
            id:
              type: integer
            name:
              type: string
            species:
              $ref: "#/components/schemas/FarmSpecies"
            count:
              type: integer
        season:
          $ref: "#/components/schemas/RationSeason"
        active:
          type: boolean
          description: The ration in effect today for its animal or group
        stage:
          $ref: "#/components/schemas/LifeStage"
        items:
          type: array
          items:
            type: object
            required: [feedKey, feedId, name, grams]
            properties:
              feedKey:
                type: [string, 'null']
              feedId:
                type: [integer, 'null']
              name:
                type: string
              grams:
                type: number
        times:
          type: array
          items:
            type: string
        waterL:
          type: [number, 'null']
        need:
          oneOf:
            - type: 'null'
            - type: object
              required: [weightKg, dmIntakeKg, waterL]
              properties:
                weightKg:
                  type: number
                dmIntakeKg:
                  type: number
                waterL:
                  type: number
        values:
          oneOf:
            - type: 'null'
            - type: object
              required: [dmKg, crudeProtein, crudeFat, crudeFibre, calcium, phosphorus, copper]
              properties:
                dmKg:
                  type: number
                crudeProtein:
                  type: number
                crudeFat:
                  type: number
                crudeFibre:
                  type: number
                calcium:
                  type: number
                phosphorus:
                  type: number
                copper:
                  type: [number, 'null']
        checks:
          type: array
          items:
            $ref: "#/components/schemas/NutrientCheck"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/FeedWarning"
        transition:
          oneOf:
            - type: 'null'
            - $ref: "#/components/schemas/FeedTransition"
        hints:
          type: array
          items:
            type: string
        group:
          type: object
          required: [feedKg, waterL]
          properties:
            feedKg:
              type: number
            waterL:
              type: [number, 'null']
        updatedAt:
          type: string
    AppStatus:
      type: object
      required: [message, level, updatedAt]
      properties:
        message:
          type: [string, 'null']
        level:
          type: string
          enum: [info, warning]
        updatedAt:
          type: [string, 'null']
    AppStatusInput:
      type: object
      required: [message, level]
      properties:
        message:
          type: [string, 'null']
          maxLength: 300
        level:
          type: string
          enum: [info, warning]
    ClientErrorInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000
        stack:
          type: [string, 'null']
          maxLength: 8000
        path:
          type: [string, 'null']
          maxLength: 500
        release:
          type: [string, 'null']
          maxLength: 40
    ErrorGroup:
      type: object
      required: [fingerprint, source, message, location, stack, release, count, firstSeen, lastSeen, resolvedAt]
      properties:
        fingerprint:
          type: string
        source:
          type: string
          enum: [server, client]
        message:
          type: string
        location:
          type: [string, 'null']
        stack:
          type: [string, 'null']
        release:
          type: [string, 'null']
        count:
          type: integer
        firstSeen:
          type: string
        lastSeen:
          type: string
        resolvedAt:
          type: [string, 'null']
    UsageDay:
      type: object
      required: [day, activeUsers, newUsers, aiActions, errors]
      properties:
        day:
          type: string
        activeUsers:
          type: integer
        newUsers:
          type: integer
        aiActions:
          type: integer
        errors:
          type: integer
    GeoReverseInput:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: WGS-84 latitude.
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: WGS-84 longitude.
    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    GeoReverseResult:
      type: object
      required: [region]
      properties:
        region:
          type: string
          description: German name of the nearest major DACH city (e.g. "München").
    LeaderboardEntry:
      type: object
      required: [rank, userId, username, leavesCount, isCurrentUser]
      properties:
        rank:
          type: integer
        userId:
          type: string
        username:
          type: string
        leavesCount:
          type: integer
        isCurrentUser:
          type: boolean
    LeaderboardResult:
      type: object
      required: [top, own]
      properties:
        top:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        own:
          description: The caller's own entry, present even when outside the top 50.
          oneOf:
            - $ref: "#/components/schemas/LeaderboardEntry"
            - type: 'null'
    PushPublicKey:
      type: object
      properties:
        publicKey:
          type: string
      required:
        - publicKey
    PushSubscriptionInput:
      type: object
      properties:
        endpoint:
          type: string
          minLength: 1
        keys:
          type: object
          properties:
            p256dh:
              type: string
              minLength: 1
            auth:
              type: string
              minLength: 1
          required:
            - p256dh
            - auth
      required:
        - endpoint
        - keys
    PushUnsubscribeInput:
      type: object
      properties:
        endpoint:
          type: string
          minLength: 1
      required:
        - endpoint
    PushTestResult:
      type: object
      properties:
        sent:
          type: integer
      required:
        - sent
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlantCategory:
      type: string
      description: >
        Auto-categorization bucket used to sort the archive: poisonous
        (Giftige Pflanzen), edible (Essbare Pflanzen), medicinal
        (Heilkräuter), mushroom (Pilze), tree (Bäume), shrub (Sträucher),
        moss (Moose), cactus (Kakteen und Sukkulenten).
      enum: [poisonous, edible, medicinal, mushroom, tree, shrub, moss, cactus]
    HumanStatus:
      type: string
      description: Deterministic human edibility status driving the "Status Mensch" badge.
      enum: [edible, poisonous]
    PoultryStatus:
      type: string
      description: Deterministic poultry safety status driving the "Status Geflügel" badge.
      enum: [safe, poisonous]
    ToxicityLevel:
      type: string
      description: >
        Degree of toxicity shown as a sublabel under the "GIFTIG" badge.
        intolerant = unverträglich (mild, digestive upset),
        poisonous = giftig (toxic, systemic effects),
        lethal = tödlich (potentially fatal).
        Only present when the status is "poisonous".
      enum: [intolerant, poisonous, lethal]
    AnimalInfo:
      type: object
      description: >
        Per-animal fact sheet: safety status plus the German toxicity
        explanation and medicinal benefits for one specific animal.
      required: [status, toxicityDetails, benefits]
      properties:
        status:
          $ref: "#/components/schemas/PoultryStatus"
        toxicityLevel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ToxicityLevel"
        toxicityDetails:
          type: string
          description: German explanation of toxicity/tolerance for this animal.
        benefits:
          type: string
          description: German medicinal benefits for this animal.
    PlantAnimals:
      type: object
      description: >
        Per-animal fact sheets keyed by animal. All keys are optional so legacy
        rows (empty object) stay valid; the UI falls back to the legacy poultry
        columns when a key is missing.
      properties:
        poultry:
          $ref: "#/components/schemas/AnimalInfo"
        rabbit:
          $ref: "#/components/schemas/AnimalInfo"
        guineaPig:
          $ref: "#/components/schemas/AnimalInfo"
        cat:
          $ref: "#/components/schemas/AnimalInfo"
        horse:
          $ref: "#/components/schemas/AnimalInfo"
    BackfillAnimalsResult:
      type: object
      description: Progress of the one-time per-animal backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing per-animal info after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    PlantSymptoms:
      type: object
      description: >
        Treatable complaints/symptoms per target (human + 5 animals), as short
        canonical German tags derived from the plant's Heilwirkung. Each target
        is optional; a missing key means the plant has not been processed yet,
        while an empty array means nothing treatable for that target. Used only
        for the "Kräuter-Hexe" filter, never as a safety signal.
      properties:
        human:
          type: array
          items:
            type: string
        poultry:
          type: array
          items:
            type: string
        rabbit:
          type: array
          items:
            type: string
        guineaPig:
          type: array
          items:
            type: string
        cat:
          type: array
          items:
            type: string
        horse:
          type: array
          items:
            type: string
    BackfillToxicityResult:
      type: object
      description: Progress of the one-time toxicity-level backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing toxicity-level info after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    BackfillFruitsResult:
      type: object
      description: Progress of the one-time edible-fruits backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing edible-fruits classification after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    BackfillPreparationResult:
      type: object
      description: Progress of the one-time preparation-method backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing preparation info after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    BackfillSymptomCasingResult:
      type: object
      description: Result of the one-time symptom casing normalisation pass.
      required: [processed, updated, done]
      properties:
        processed:
          type: integer
          description: Total number of plants inspected.
        updated:
          type: integer
          description: Number of plants whose symptom tags were changed.
        done:
          type: boolean
          description: Always true; the entire table is processed in one pass.
    BackfillSymptomsResult:
      type: object
      description: Progress of the one-time treatable-symptom backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing symptom tags after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    BackfillEdibleMedicinalResult:
      type: object
      description: Progress of the edible-to-medicinal promotion backfill batch.
      required: [processed, promoted, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of edible plants reviewed in this batch.
        promoted:
          type: integer
          description: Number of edible plants promoted to "medicinal" in this batch.
        remaining:
          type: integer
          description: Edible plants still awaiting review after this batch.
        done:
          type: boolean
          description: True when no edible plants remain to be reviewed.
    BackfillMedicinalReviewResult:
      type: object
      description: Progress of the medicinal-plant review backfill batch.
      required: [processed, reclassified, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants reviewed in this batch.
        reclassified:
          type: integer
          description: Number of plants reclassified away from "medicinal" in this batch.
        remaining:
          type: integer
          description: Plants still awaiting review after this batch.
        done:
          type: boolean
          description: True when no medicinal plants remain to be reviewed.
    BackfillSymptomApplicationsResult:
      type: object
      description: Progress of the one-time symptom-application-instructions backfill batch.
      required: [processed, remaining, done]
      properties:
        processed:
          type: integer
          description: Number of plants filled in this batch.
        remaining:
          type: integer
          description: Plants still missing application instructions after this batch.
        done:
          type: boolean
          description: True when no plants remain to backfill.
    PlantSymptomApplications:
      type: object
      description: >
        Per-target map of symptom tag → short German application instruction
        describing how to prepare/use the herb to treat that specific complaint.
        Each target is optional (missing = not yet processed; empty object =
        nothing applicable). Keys within each target match the canonical symptom
        tags from PlantSymptoms.
      properties:
        human:
          type: object
          additionalProperties:
            type: string
        poultry:
          type: object
          additionalProperties:
            type: string
        rabbit:
          type: object
          additionalProperties:
            type: string
        guineaPig:
          type: object
          additionalProperties:
            type: string
        cat:
          type: object
          additionalProperties:
            type: string
        horse:
          type: object
          additionalProperties:
            type: string
    PlantHealthInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: >
            Base64-encoded data URL of the plant photo to analyse
            (e.g. "data:image/jpeg;base64,...").
    PlantHealthRemedy:
      type: object
      required: [name, zutaten, anleitung]
      properties:
        name:
          type: string
          description: German name of the home remedy.
        zutaten:
          type: array
          items:
            type: string
          description: List of ingredients (German).
        anleitung:
          type: string
          description: Short German application instruction.
    PlantHealthResult:
      type: object
      required: [pflanzen_name, gesundheits_score, symptome, hausmittel, duenge_biologisch, duenge_chemisch]
      properties:
        pflanzen_name:
          type: string
          description: Identified plant name (German common name + botanical name).
        gesundheits_score:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Overall health score: 100 = vollkommen gesund, 0 = sehr krank/absterbend.
        symptome:
          type: array
          items:
            type: string
          description: List of detected health issues in German (e.g. "Blattflecken", "Chlorose").
        hausmittel:
          type: array
          items:
            $ref: "#/components/schemas/PlantHealthRemedy"
          description: >
            Biological home remedies to treat the detected issues.
            Empty when gesundheits_score is 100.
        duenge_biologisch:
          type: string
          description: >
            General organic/biological fertilizer recommendation for this plant (German).
        duenge_chemisch:
          type: string
          description: >
            General mineral/chemical fertilizer recommendation for this plant (German).
    PlantScanInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: >
            Base64-encoded data URL of the captured/uploaded photo (e.g.
            "data:image/jpeg;base64,..."). Must be an image data URL
            (data:image/*;base64,...); other payloads are rejected with 400.
            The image is used for AI identification but is NOT stored server-side;
            use localImageId to identify the photo in the device's local store.
        imageSide:
          type: string
          description: >
            Optional second photo as a base64 data URL - the side view of the
            two-photo mushroom scan (whole mushroom with stem, gills and stem
            base). Same format rules as `image`. A mushroom is only ever
            listed as edible when this side view was provided AND the model
            confirmed a confident identification; otherwise it is stored as
            not edible with an explanation.
        localImageId:
          type: string
          description: >
            Client-generated UUID (crypto.randomUUID()) identifying the photo
            in the device's local IndexedDB image store. Stored server-side so
            the client can resolve the local image when displaying the entry.
            For two-photo mushroom scans, the side image is stored under the
            derived key "${localImageId}-side" in the same store.
            Omit for legacy clients that still embed image bytes in the response.
        locationRegion:
          type: string
          description: >
            Optional coarse location region where the scan was taken
            (e.g. "München", "Bayern"). Max 80 characters. The client derives
            this from GPS coordinates via the /geo/reverse endpoint; only the
            plain text name reaches the server — no coordinates are stored.
    ImageLockInput:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
    Plant:
      type: object
      required:
        - id
        - germanName
        - botanicalName
        - category
        - humanStatus
        - poultryStatus
        - edibilityDetails
        - animalToxicityDetails
        - activeIngredients
        - humanBenefits
        - poultryBenefits
        - habitat
        - siteConditions
        - otherUses
        - fertilizerTips
        - animals
        - symptoms
        - symptomApplications
        - hasSideImage
        - createdAt
      properties:
        id:
          type: integer
        germanName:
          type: string
          description: Common German name of the plant.
        botanicalName:
          type: string
          description: Scientific/botanical (Latin) name of the plant.
        category:
          $ref: "#/components/schemas/PlantCategory"
        humanStatus:
          $ref: "#/components/schemas/HumanStatus"
        poultryStatus:
          $ref: "#/components/schemas/PoultryStatus"
        edibilityDetails:
          type: string
          description: German-language explanation of edibility/toxicity for humans.
        animalToxicityDetails:
          type: string
          description: German-language explanation of toxicity for poultry/chickens and general animals.
        activeIngredients:
          type: string
          description: Inhaltsstoffe - active ingredients/compounds, in German.
        humanBenefits:
          type: string
          description: Medical benefits for humans (illnesses/symptoms it helps against), in German.
        poultryBenefits:
          type: string
          description: Medical benefits for poultry (e.g. respiratory health, digestion), in German.
        habitat:
          type: string
          description: >
            Where the plant usually grows - typical habitats and locations
            (e.g. Wiesen, Wegränder, Waldränder), in German. Empty string
            when unknown for legacy entries.
        siteConditions:
          type: string
          description: >
            Site requirements the location must fulfil for the plant to grow
            (light, soil, moisture, nutrients), in German. Empty string when
            unknown for legacy entries.
        otherUses:
          type: string
          description: >
            "Weitere Nutzung" - practical uses beyond eating/medicine, e.g.
            fertilizer brew (Jauche/Sud) as with comfrey or nettle, mulch,
            dye plant, fibres; in German. Empty string for legacy entries.
        fertilizerTips:
          type: string
          description: >
            How to fertilize this plant when growing it yourself (suitable
            fertilizer, frequency, caveats), in German. Empty string for
            legacy entries.
        animals:
          $ref: "#/components/schemas/PlantAnimals"
        symptoms:
          $ref: "#/components/schemas/PlantSymptoms"
        symptomApplications:
          $ref: "#/components/schemas/PlantSymptomApplications"
        humanToxicityLevel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ToxicityLevel"
        hasEdibleFruits:
          type: boolean
          nullable: true
          description: >
            Whether the plant produces edible fruits. Relevant primarily for
            trees and shrubs. Null for legacy entries not yet backfilled.
        preparation:
          type: string
          description: >
            Short German description of how the edible plant can be prepared
            (e.g. "Roh, gekocht, als Tee oder Salat"). Only meaningful for
            edible plants; empty string for poisonous/legacy entries.
        scannedByUserId:
          type: string
          nullable: true
          description: >
            ID of the user who triggered this scan. Null for plants scanned
            before per-user tracking was introduced.
        hasSideImage:
          type: boolean
          description: >
            True when a verified side-view photo exists for this entry (either
            stored in the database for legacy rows, or confirmed at scan time
            for new local-first rows). Image bytes are never embedded in JSON
            responses.
        localImageId:
          type: string
          nullable: true
          description: >
            UUID that identifies the main photo in the client's local IndexedDB
            image store. Null for entries created before the local-first
            migration (those use the GET /plants/{id}/image endpoint instead).
            When a mushroom side image exists, it is stored under the derived
            key "${localImageId}-side" in the same IndexedDB store.
        imageQuality:
          type: integer
          nullable: true
          description: >
            AI rating 1-10 of how well the shared photo shows the species. A
            later scan with a clearly better photo replaces it, unless
            imageLocked is set. Null for photos never rated.
        imageLocked:
          type: boolean
          description: >
            Set by the admin: the shared photo is never replaced automatically.
        imageUrl:
          type: string
          nullable: true
          description: >
            Public https URL of the main photo on the image CDN (Cloudinary).
            Use it directly as an <img> source.
            Takes priority over localImageId and the legacy image endpoint.
            Rows scanned before the CDN switch may still hold an internal
            "/objects/..." path, which is no longer servable and must be
            ignored by clients.
        imageUrlSide:
          type: string
          nullable: true
          description: >
            Public https URL of the mushroom side-view photo, same rules as
            imageUrl.
        locationRegion:
          type: string
          nullable: true
          description: >
            Coarse location region where the scan was taken (e.g. "München").
            Null when the user did not grant location permission.
        createdAt:
          type: string
          format: date-time
    PlantScanResult:
      type: object
      required: [plant, alreadyInArchive]
      properties:
        plant:
          $ref: "#/components/schemas/Plant"
        alreadyInArchive:
          type: boolean
          description: >
            True when the scanned plant matched an entry already in the
            archive (by botanical name); in that case no new entry was
            created and the existing one is returned.
        imageMerged:
          type: boolean
          nullable: true
          description: >
            True when alreadyInArchive is true AND the existing entry had no
            image before this scan — the new photo was automatically attached
            to the existing entry (Smart Merge). Null/absent for new entries
            or duplicates that already had an image.
        imageImproved:
          type: boolean
          nullable: true
          description: >
            True when this scan's photo was clearly better than the shared one
            and replaced it.
    DeletePlantInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Archive password required to delete an entry.
    UpdatePlantInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Archive password required to modify an entry.
        imageData:
          type: string
          description: >
            Replacement photo as a base64 data URL (e.g. a recompressed
            version of the stored photo). Must be a JPEG/PNG/WebP data URL.
        habitat:
          type: string
          description: Replacement habitat text (German).
        siteConditions:
          type: string
          description: Replacement site-conditions text (German).
        otherUses:
          type: string
          description: Replacement "Weitere Nutzung" text (German).
        fertilizerTips:
          type: string
          description: Replacement fertilizing-tips text (German).
        category:
          $ref: "#/components/schemas/PlantCategory"
    CategoryCount:
      type: object
      required: [category, count, poisonousCount, edibleCount]
      properties:
        category:
          $ref: "#/components/schemas/PlantCategory"
        count:
          type: integer
        poisonousCount:
          type: integer
          description: >
            Entries in this category whose humanStatus is "poisonous". Lets
            the UI split a category (namely Pilze) into poisonous/edible
            sub-groups without loading full rows.
        edibleCount:
          type: integer
          description: Entries in this category whose humanStatus is "edible".
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, approved, isOwner, username, leavesCount]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        approved:
          type: boolean
          description: Whether the owner has granted this account access to the app.
        isOwner:
          type: boolean
          description: Whether this account is the app owner (the first account that ever signed in).
        username:
          type: [string, 'null']
        leavesCount:
          type: integer
        blockedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Set when the owner blocked the account through moderation; the app
            then says "gesperrt" instead of "warte auf Freigabe".
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: 'null'
    ManagedUser:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - profileImageUrl
        - approved
        - isOwner
        - createdAt
        - username
        - leavesCount
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        approved:
          type: boolean
        isOwner:
          type: boolean
        createdAt:
          type: string
          format: date-time
        username:
          type: [string, 'null']
        leavesCount:
          type: integer
    TaskActionType:
      type: string
      description: The type of care action to perform.
      enum:
        - Gießen
        - Besprühen
        - Düngen
        - Pflanze drehen
    TaskIntervalUnit:
      type: string
      description: The unit of the reminder interval.
      enum:
        - Tage
        - Wochen
        - Monate
    TaskFertilizerType:
      type: string
      description: The type of fertilizer (only relevant when actionType is "Düngen").
      enum:
        - Biologischer Dünger
        - Mineralischer Dünger
        - Manuell
    Task:
      type: object
      required:
        - id
        - userId
        - plantId
        - actionType
        - intervalValue
        - intervalUnit
        - reminderTime
        - isActive
        - createdAt
      properties:
        id:
          type: integer
        userId:
          type: string
        plantId:
          type: integer
        actionType:
          $ref: "#/components/schemas/TaskActionType"
        intervalValue:
          type: integer
          minimum: 1
          maximum: 60
        intervalUnit:
          $ref: "#/components/schemas/TaskIntervalUnit"
        reminderTime:
          type: string
          description: Local time for reminder in HH:MM format (e.g. "08:00").
        isActive:
          type: boolean
        lastCompletedAt:
          type: string
          nullable: true
          description: ISO timestamp of the last time this task was marked as done.
        fertilizerType:
          nullable: true
          description: Fertilizer sub-type, only set when actionType is "Düngen".
          oneOf:
            - $ref: "#/components/schemas/TaskFertilizerType"
        fertilizerCustomName:
          type: string
          nullable: true
          description: Custom fertilizer name when fertilizerType is "Manuell".
        createdAt:
          type: string
    UpdateTaskInput:
      type: object
      description: All fields optional – only provided fields are updated.
      properties:
        actionType:
          $ref: "#/components/schemas/TaskActionType"
        intervalValue:
          type: integer
          minimum: 1
          maximum: 60
        intervalUnit:
          $ref: "#/components/schemas/TaskIntervalUnit"
        reminderTime:
          type: string
          description: Local time for reminder in HH:MM format (e.g. "08:00").
        fertilizerType:
          nullable: true
          description: Fertilizer sub-type, only relevant when actionType is "Düngen".
          oneOf:
            - $ref: "#/components/schemas/TaskFertilizerType"
        fertilizerCustomName:
          type: string
          nullable: true
          description: Custom fertilizer name when fertilizerType is "Manuell".
    CreateTaskInput:
      type: object
      required:
        - plantId
        - actionType
        - intervalValue
        - intervalUnit
        - reminderTime
      properties:
        plantId:
          type: integer
        actionType:
          $ref: "#/components/schemas/TaskActionType"
        intervalValue:
          type: integer
          minimum: 1
          maximum: 60
        intervalUnit:
          $ref: "#/components/schemas/TaskIntervalUnit"
        reminderTime:
          type: string
          description: Local time for reminder in HH:MM format (e.g. "08:00").
        fertilizerType:
          nullable: true
          description: Fertilizer sub-type, only set when actionType is "Düngen".
          oneOf:
            - $ref: "#/components/schemas/TaskFertilizerType"
        fertilizerCustomName:
          type: string
          nullable: true
          description: Custom fertilizer name when fertilizerType is "Manuell".
    FavoriteIds:
      type: object
      required: [plantIds]
      properties:
        plantIds:
          type: array
          items:
            type: integer
          description: IDs of all plants the current user has marked as a favourite.
    UpdateUserApprovalInput:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: True grants access, false revokes it (the owner account cannot be modified).
    InsectCategory:
      type: string
      description: >
        Taxonomic / ecological group of the insect or arthropod.
        "beetle"=Käfer, "butterfly"=Schmetterlinge und Motten,
        "bee_wasp"=Bienen/Wespen/Hummeln/Ameisen, "fly_mosquito"=Fliegen und Mücken,
        "bug_cicada"=Wanzen und Zikaden, "grasshopper"=Heuschrecken und Grillen,
        "dragonfly"=Libellen, "spider_other"=Spinnen und andere Gliedertiere.
      enum:
        - beetle
        - butterfly
        - bee_wasp
        - fly_mosquito
        - bug_cicada
        - grasshopper
        - dragonfly
        - spider_other
    InsectRelationStatus:
      type: string
      description: >
        Relationship of the insect to garden / cultivated plants.
        "pest"=Schädling (harms plants), "beneficial"=Nützling (predator or pollinator),
        "neutral"=Neutral.
      enum:
        - pest
        - beneficial
        - neutral
    Insect:
      type: object
      required:
        - id
        - germanName
        - scientificName
        - category
        - relationStatus
        - affectedPlants
        - description
        - treatmentTips
        - createdAt
      properties:
        id:
          type: integer
        germanName:
          type: string
          description: German common name (e.g. "Marienkäfer").
        scientificName:
          type: string
          description: Scientific / Latin name (e.g. "Coccinella septempunctata").
        category:
          $ref: "#/components/schemas/InsectCategory"
        relationStatus:
          $ref: "#/components/schemas/InsectRelationStatus"
        affectedPlants:
          type: array
          items:
            type: string
          description: German names of plants this insect frequently targets or visits.
        description:
          type: string
          description: German description of appearance, habitat, and behaviour.
        treatmentTips:
          type: string
          description: >
            For pests: organic / biological treatment and prevention tips in German.
            Empty string for beneficial and neutral insects.
        plantContext:
          type: string
          nullable: true
          description: >
            German common name of the plant the insect was photographed on, when
            a host plant was clearly visible. Null otherwise.
        scannedByUserId:
          type: string
          nullable: true
          description: ID of the user who triggered this scan.
        localImageId:
          type: string
          nullable: true
          description: >
            UUID that identifies the photo in the client's local IndexedDB
            image store. Null for entries created before the local-first
            migration (those use GET /insects/{id}/image instead).
        imageQuality:
          type: integer
          nullable: true
          description: >
            AI rating 1-10 of how well the shared photo shows the species. A
            later scan with a clearly better photo replaces it, unless
            imageLocked is set. Null for photos never rated.
        imageLocked:
          type: boolean
          description: >
            Set by the admin: the shared photo is never replaced automatically.
        imageUrl:
          type: string
          nullable: true
          description: >
            Public https URL of the photo on the image CDN (Cloudinary).
            Use it directly as an <img> source. Takes priority over
            localImageId and the legacy image endpoint.
        locationRegion:
          type: string
          nullable: true
          description: >
            Coarse location region where the scan was taken (e.g. "München").
            Null when the user did not grant location permission.
        createdAt:
          type: string
          format: date-time
    ScanInsectInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: >
            Base64-encoded data URL of the captured photo
            (e.g. "data:image/jpeg;base64,..."). Must be an image data URL.
            The image is used for AI identification only and is NOT stored
            server-side; use localImageId for local storage reference.
        localImageId:
          type: string
          description: >
            Client-generated UUID (crypto.randomUUID()) identifying the photo
            in the device's local IndexedDB image store.
        locationRegion:
          type: string
          description: >
            Optional coarse location region (e.g. "München"). Same semantics
            as PlantScanInput.locationRegion.
    CareGuideDailyEntry:
      type: object
      required: [day, giessen, bespruehen, beschneiden, drehen, duengen, umtopfen]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 30
        giessen:
          type: boolean
        bespruehen:
          type: boolean
        beschneiden:
          type: boolean
          nullable: true
        drehen:
          type: boolean
        duengen:
          type: boolean
        duengerart:
          type: string
          nullable: true
          description: "biologisch | mineralisch | null"
        umtopfen:
          type: boolean
          description: Repotting recommended on this day (only true on day 1 or 2 when repotting is needed)
        notizen:
          type: string
    CareGuide:
      type: object
      required: [id, userId, plantName, targetHumidity, startDate, endDate, status, dailyPlan, hasImageDay1, hasImageDay30, reminderEnabled, reminderTime, completedDays, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        plantId:
          type: integer
          nullable: true
        plantName:
          type: string
        targetHumidity:
          type: string
        potSizeRecommendation:
          type: string
          nullable: true
          description: Assessment of current pot size, e.g. "Aktueller Topf ist ausreichend" or "Umtopfen empfohlen"
        recommendedPotDiameter:
          type: string
          nullable: true
          description: Recommended minimum pot diameter in cm when repotting is needed, e.g. "18 cm"
        recommendedSoilType:
          type: string
          nullable: true
          description: Recommended soil type for this plant, e.g. "Zimmerpflanzenerde mit Perlit"
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [Aktiv, Abgeschlossen]
        dailyPlan:
          type: array
          items:
            $ref: "#/components/schemas/CareGuideDailyEntry"
        hasImageDay1:
          type: boolean
        hasImageDay30:
          type: boolean
        reminderEnabled:
          type: boolean
          description: Whether daily reminders are active for this guide.
        reminderTime:
          type: string
          description: Time of day for the reminder in HH:MM format, e.g. "09:00".
        completedDays:
          type: array
          items:
            type: integer
          description: List of day numbers (1–30) the user has marked as done.
        createdAt:
          type: string
    UpdateCareGuideInput:
      type: object
      properties:
        reminderEnabled:
          type: boolean
        reminderTime:
          type: string
          description: HH:MM format, e.g. "09:00"
        completedDays:
          type: array
          items:
            type: integer
    CreateCareGuideInput:
      type: object
      required: [plantName, healthScore, symptoms, duengeBiologisch, duegeChemisch]
      properties:
        plantId:
          type: integer
          nullable: true
