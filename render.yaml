# Render Blueprint für die Kräuter-Hexe
# Doku: https://render.com/docs/blueprint-spec
#
# Ein einziger Web Service bedient beides: die REST-API unter /api/* und die
# gebaute PWA unter allen anderen Pfaden (SERVE_WEB_CLIENT=true). Das ist nötig,
# weil der kostenlose Tarif nur einen Service erlaubt — und es passt zum
# Sicherheitsmodell der App: das Session-Cookie ist an dieselbe Domain gebunden
# und es gibt bewusst kein CORS.
#
# Achtung, kostenloser Tarif: der Service wird nach ~15 Minuten ohne Anfragen
# schlafen gelegt und braucht beim nächsten Aufruf ca. 30-60 Sekunden zum
# Aufwachen. Push-Erinnerungen laufen deshalb über einen externen Cron-Dienst
# (z. B. cron-job.org), der POST /api/cron/trigger-notifications mit dem Header
# "Authorization: Bearer <CRON_SECRET>" aufruft. Dieser Aufruf weckt den Service
# gleichzeitig wieder auf.

services:
  - type: web
    name: kraeuter-hexe
    runtime: node
    plan: free
    # Frankfurt = kürzeste Wege für Nutzer in Deutschland und nah an der
    # Neon-Datenbank in eu-central-1.
    region: frankfurt
    branch: main
    autoDeploy: true

    # Das Repo ist ein pnpm-Monorepo. corepack aktiviert die in package.json
    # unter "packageManager" festgelegte pnpm-Version, damit die Lockfile passt.
    # Gebaut werden nur die beiden Pakete, die im Betrieb gebraucht werden —
    # nicht die Design-Werkbank aus der Entwicklung.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:server
    startCommand: pnpm run start

    healthCheckPath: /api/healthz

    envVars:
      # --- Plattform / Build ---------------------------------------------
      - key: NODE_VERSION
        value: "24.13.0"
      - key: NODE_ENV
        value: production
      # Die PWA liegt auf Render im Wurzelverzeichnis der Domain, nicht mehr
      # unter einem Unterpfad. Wird schon beim Build gebraucht.
      - key: BASE_PATH
        value: /
      # Lässt den API-Server zusätzlich die gebaute PWA ausliefern.
      - key: SERVE_WEB_CLIENT
        value: "true"
      - key: LOG_LEVEL
        value: info

      # --- Geheimnisse: sync:false heißt "im Render-Dashboard eintragen" ---
      # Postgres-Verbindung (Neon). Die Datenbank bleibt, wo sie ist.
      - key: NEON_DATABASE_URL
        sync: false
      # Google Gemini — Pflanzen- und Insektenerkennung.
      - key: GEMINI_API_KEY
        sync: false
      # Bearer-Token, mit dem sich der externe Cron-Dienst ausweist.
      - key: CRON_SECRET
        sync: false
      # PIN zum Löschen von Einträgen.
      - key: DELETE_PASSWORD
        sync: false
      # Signiert die Anmelde-Tokens. Langer Zufallsstring; wird er geändert,
      # müssen sich alle neu anmelden.
      - key: JWT_SECRET
        sync: false
      # Cloudinary-Zugangsdaten für die Bild-Uploads
      # (Cloudinary Dashboard → Account Details → API environment variable).
      - key: CLOUDINARY_URL
        sync: false
      # Optional: gemeinsamer Einladungscode für die Registrierung.
      # Weglassen, wenn keiner verlangt werden soll – dann zeigt die Anmeldung kein
      # Feld „Einladungscode“. Für die Testphase mit SITE_PASSWORD NICHT setzen.
      - key: REGISTRATION_CODE
        sync: false

      # --- Öffentliche App -------------------------------------------------
      # "true" = neue Konten sind sofort nutzbar, ohne Freischaltung durch den
      # Inhaber. Erst einschalten, wenn Impressum/Datenschutz vollständig sind
      # (artifacts/pflanzenscanner/src/lib/legal.ts). Für den öffentlichen
      # Betrieb außerdem REGISTRATION_CODE entfernen.
      - key: OPEN_REGISTRATION
        sync: false
      # Testphase: die ersten so vielen Konten (ohne Inhaber, bestehende zählen
      # mit) sind ohne Freischaltung sofort nutzbar. "0" schaltet es ab.
      - key: FREE_TESTER_SLOTS
        value: "20"
      # Höchstzahl KI-Scans pro Tag für die ganze App (alle Nutzer zusammen,
      # der Inhaber zählt nicht mit). Schützt die Gemini-Rechnung, wenn sich
      # jeder registrieren kann.
      - key: SCAN_DAILY_BUDGET
        value: "300"
      # Cloudflare Turnstile (Bot-Schutz bei der Registrierung). Beide Werte
      # aus dem Cloudflare-Dashboard → Turnstile → Widget. Nur wenn beide
      # gesetzt sind, wird die Prüfung verlangt.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # --- Mit Google anmelden ----------------------------------------------
      # Beide Werte aus der Google Cloud Console (APIs & Dienste → Anmeldedaten
      # → OAuth-Client "Webanwendung"). Nur wenn BEIDE gesetzt sind, zeigt die
      # Anmeldung den Google-Knopf. Weiterleitungs-URI dort:
      # https://littlefarming.de/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Vorschau-Schutz (docs/landingpage.md) ---------------------------
      # Solange gesetzt, zeigt die ganze Seite (Landingpage, App, API) nur ein
      # Passwortfeld. Leer lassen bzw. löschen, sobald die App öffentlich ist.
      - key: SITE_PASSWORD
        sync: false

      # --- Umzug auf littlefarming.de ---------------------------------------
      # Alte Adressen, von denen die neue Adresse Gerätedaten (Fotos,
      # Warteschlange) annimmt. Der Umzug selbst startet, sobald PUBLIC_BASE_URL
      # auf https://littlefarming.de steht: Dann zeigt jede andere Adresse den
      # Umzugshelfer statt der App.
      - key: LEGACY_ORIGINS
        value: "https://kraeuter-hexe.onrender.com"
