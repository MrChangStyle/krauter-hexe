          type: [string, 'null']
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        repeats:
          type: boolean
        assigneeId:
          type: [string, 'null']
        animalId:
          type: [integer, 'null']
        herdId:
          type: [integer, 'null']
        notes:
          type: [string, 'null']
          maxLength: 200
        intervalValue:
          type: integer
          minimum: 1
          maximum: 365
        intervalUnit:
          $ref: "#/components/schemas/TaskIntervalUnit"
        weekdays:
          type: [array, 'null']
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: Fixed weekdays, 1 = Montag … 7 = Sonntag; replaces the interval. null = every interval.
        reminderTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        isActive:
          type: boolean
