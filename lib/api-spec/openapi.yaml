            type: string
        createdAt:
          type: string
    CornerSuggestion:
      type: object
      required: [corners]
      properties:
        corners:
          type: [array, 'null']
          items:
            $ref: "#/components/schemas/PhotoPoint"
    PlantingSuggestionInput:
      type: object
      properties:
        wishes:
          type: [string, 'null']
          maxLength: 300
    PlantingProposal:
      type: object
      required: [items, dropped, notes]
      properties:
        items:
          type: array
          items:
            type: object
            required: [cropKey, label, x, y, w, h]
            properties:
              cropKey:
                type: string
              label:
                type: string
              x:
                type: integer
              y:
                type: integer
              w:
                type: integer
              h:
                type: integer
        dropped:
          type: array
          items:
            type: object
            required: [label, reason]
            properties:
              label:
                type: string
              reason:
                type: string
        notes:
          type: string
    CropRequestInput:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 40
        plantId:
          type: [integer, 'null']
    CropDraft:
      type: object
      required: [crop, status, createdAt]
      properties:
        crop:
          $ref: "#/components/schemas/Crop"
        status:
          type: string
          enum: [draft, approved]
        createdAt:
          type: string
    CropRequestResult:
      type: object
      required: [draft, existing]
      properties:
        draft:
          $ref: "#/components/schemas/CropDraft"
        existing:
          type: boolean
          description: The catalog or an earlier draft already had this plant – no AI call was made
    PhotoPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    BedPhotoInput:
      type: object
      required: [imageData]
      properties:
        imageData:
          type: string
          description: JPEG/PNG/WebP data URL, already downscaled by the app.
        heading:
          type: [number, 'null']
    BedCornersInput:
      type: object
      required: [corners]
      properties:
        corners:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/PhotoPoint"
    HarvestUse:
      type: string
      enum: [kitchen, fodder]
    Harvest:
      type: object
      required: [id, plantingId, bedId, season, cropKey, label, cells, harvestedOn, amountKg, use, note]
      properties:
        id:
          type: integer
        plantingId:
          type: [integer, 'null']
        bedId:
          type: [integer, 'null']
        season:
          type: integer
        cropKey:
          type: [string, 'null']
        label:
          type: string
        cells:
          type: integer
          description: Cells (30 × 30 cm) of the planting when harvested
        harvestedOn:
          type: string
          description: YYYY-MM-DD
        amountKg:
          type: number
        use:
          $ref: "#/components/schemas/HarvestUse"
        note:
          type: [string, 'null']
    HarvestInput:
      type: object
      required: [harvestedOn, amountKg, use]
      properties:
        harvestedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        amountKg:
          type: number
        use:
          $ref: "#/components/schemas/HarvestUse"
        note:
          type: [string, 'null']
          maxLength: 300
    GardenDirection:
      type: string
      enum: [vegetables, herbs, fruit, storage]
    GardenGoals:
      type: object
      required: [people, animalShare, directions, hoursPerWeek]
      properties:
        people:
          type: integer
          minimum: 0
          maximum: 30
        animalShare:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of the bed area for animal fodder (%)
        directions:
          type: array
          items:
            $ref: "#/components/schemas/GardenDirection"
        hoursPerWeek:
          type: [integer, 'null']
          minimum: 0
          maximum: 80
    GardenPlan:
      type: object
      required: [goals, kitchenNeedM2, fodder, availableM2, kitchenM2, fodderM2, kitchenCoverage, fodderCoverage, manageableM2, learned, beds, tips]
      properties:
        goals:
          $ref: "#/components/schemas/GardenGoals"
        kitchenNeedM2:
          type: number
        fodder:
          type: object
          required: [animals, perDayKg, summerKg, winterKg, needM2]
          properties:
            animals:
              type: array
              items:
                type: object
                required: [species, count, perDayKg]
                properties:
                  species:
                    $ref: "#/components/schemas/FarmSpecies"
                  count:
                    type: integer
                  perDayKg:
                    type: number
            perDayKg:
              type: number
            summerKg:
              type: number
            winterKg:
              type: number
            needM2:
              type: number
        availableM2:
          type: number
        kitchenM2:
          type: number
        fodderM2:
          type: number
        kitchenCoverage:
          type: [integer, 'null']
          description: Percent of the kitchen need the kitchen beds cover
        fodderCoverage:
          type: [integer, 'null']
        manageableM2:
          type: [number, 'null']
          description: Area the given hours per week can look after
        learned:
          description: Own yields (latest season with harvests) the plan was computed with
          oneOf:
            - type: 'null'
            - type: object
              required: [season, kitchenKgPerM2, fodderKgPerM2]
              properties:
                season:
                  type: integer
                kitchenKgPerM2:
                  type: [number, 'null']
                fodderKgPerM2:
                  type: [number, 'null']
        beds:
          type: array
          items:
            type: object
            required: [bedId, name, areaM2, role, crops, wishes]
            properties:
              bedId:
                type: integer
              name:
                type: string
              areaM2:
                type: number
              role:
                type: string
                enum: [kitchen, fodder]
              crops:
                type: array
                items:
                  type: string
              wishes:
                type: string
                description: Wishes for the KI planting suggestion of this bed
        tips:
          type: array
          items:
            type: string
    GardenBedInput:
      type: object
      required: [name, type, lengthCm, widthCm]
      properties:
        builtYear:
          type: [integer, 'null']
          description: Raised beds only – the year it was filled
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: "#/components/schemas/BedType"
        lengthCm:
          type: integer
        widthCm:
          type: integer
        heightCm:
          type: [integer, 'null']
        postalCode:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
          description: From the phone's GPS; wins over the postal code.
        longitude:
          type: [number, 'null']
        sunHours:
          type: [integer, 'null']
        orientation:
          oneOf:
            - $ref: "#/components/schemas/BedOrientation"
            - type: 'null'
        windProtection:
          oneOf:
            - $ref: "#/components/schemas/WindProtection"
            - type: 'null'
        soilTexture:
          oneOf:
            - $ref: "#/components/schemas/SoilTexture"
            - type: 'null'
        soilPh:
          type: [number, 'null']
        frostDates:
          description: Own frost dates; null hands them back to the weather history; omitted keeps them.
          oneOf:
            - $ref: "#/components/schemas/FrostDates"
            - type: 'null'
        notes:
          type: [string, 'null']
          maxLength: 2000
    WeekRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: integer
          description: Weeks relative to the last spring frost (negative = before)
        to:
          type: integer
    Crop:
      type: object
      required: [key, name, botanicalName, group, family, feeder, spacingCm, rowSpacingCm, light, frostHardy, sowIndoor, directSow, plantOut, harvest, good, bad, color]
      properties:
        key:
          type: string
        name:
          type: string
        botanicalName:
          type: string
        group:
          type: string
          enum: [vegetable, herb, flower, fruit]
        family:
          type: string
        feeder:
          type: string
          enum: [heavy, medium, light]
        spacingCm:
          type: integer
        rowSpacingCm:
          type: integer
        light:
          type: string
          enum: [full, partial, shade]
        frostHardy:
          type: boolean
        sowIndoor:
          oneOf:
            - $ref: "#/components/schemas/WeekRange"
            - type: 'null'
        directSow:
          oneOf:
            - $ref: "#/components/schemas/WeekRange"
            - type: 'null'
        plantOut:
          oneOf:
            - $ref: "#/components/schemas/WeekRange"
            - type: 'null'
        harvest:
          type: object
          required: [from, to]
          properties:
            from:
              type: integer
            to:
              type: integer
        good:
          type: array
          items:
            type: string
        bad:
          type: array
          items:
            type: string
        color:
          type: string
    BedPlanting:
      type: object
      required: [id, season, cropKey, plantId, label, x, y, w, h]
      properties:
        id:
          type: integer
        season:
          type: integer
        cropKey:
          type: [string, 'null']
        plantId:
          type: [integer, 'null']
        label:
          type: string
        x:
          type: integer
          description: Column of the top-left cell (along the bed's length)
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
    GardenEventKind:
      type: string
      enum: [sow_indoor, direct_sow, plant_out, harvest]
    GardenCalendarEntry:
      type: object
      required: [plantingId, bedId, bedName, label, cropKey, kind, start, end, done, open]
      properties:
        plantingId:
          type: integer
        bedId:
          type: integer
        bedName:
          type: string
        label:
          type: string
        cropKey:
          type: string
        kind:
          $ref: "#/components/schemas/GardenEventKind"
        start:
          type: string
          description: First day, YYYY-MM-DD
        end:
          type: string
          description: Last day, YYYY-MM-DD
        done:
          type: boolean
        open:
          type: boolean
          description: Still to do – false when ticked off or no longer needed (sown directly instead of indoors)
    FrostWarning:
      type: object
      required: [bedId, bedName, night, minTemp, plants]
      properties:
        bedId:
          type: integer
        bedName:
          type: string
        night:
          type: string
          description: Day the night starts, YYYY-MM-DD
        minTemp:
          type: number
          description: Lowest forecast air temperature (°C)
        plants:
          type: array
          items:
            type: string
    BedPlantingInput:
      type: object
      required: [x, y]
      properties:
        cropKey:
          type: [string, 'null']
        plantId:
          type: [integer, 'null']
        x:
          type: integer
        y:
          type: integer
    FarmMember:
      type: object
      required: [userId, displayName, email, role, isMe]
      properties:
        userId:
          type: string
        displayName:
          type: string
        email:
          type: [string, 'null']
          description: Only filled in for admins.
        role:
          $ref: "#/components/schemas/FarmRole"
        isMe:
          type: boolean
    FarmNameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    DeleteFarmInput:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
    AddFarmMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          $ref: "#/components/schemas/FarmRole"
    ChangeFarmRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/FarmRole"
    ReportContentType:
      type: string
      enum: [plant_image, insect_image, username]
    ReportReason:
      type: string
      enum: [unangemessen, person, falsch, urheberrecht, spam, sonstiges]
    CreateReportInput:
      type: object
      required: [contentType, contentId, reason]
      properties:
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        contentId:
          type: string
          minLength: 1
          maxLength: 100
          description: Plant id, insect id, or the user id from the leaderboard.
        reason:
          $ref: "#/components/schemas/ReportReason"
        note:
          type: string
          maxLength: 500
    ReportReasonCount:
      type: object
      required: [reason, count]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        count:
          type: integer
    ReportGroup:
      type: object
      required: [contentType, contentId, reportCount, reasons, notes, firstReportedAt, exists, label, imageUrl]
      properties:
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        contentId:
          type: string
        reportCount:
          type: integer
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/ReportReasonCount"
        notes:
          type: array
          items:
            type: string
        firstReportedAt:
          type: string
          format: date-time
        exists:
          type: boolean
          description: False when the content is already gone (deleted plant, photo, account or username).
        label:
          type: string
          description: Plant/insect name, or the username as reported.
        imageUrl:
          type: [string, 'null']
    ResolveReportsInput:
      type: object
      required: [contentType, contentId, action]
      properties:
        contentType:
          $ref: "#/components/schemas/ReportContentType"
        contentId:
          type: string
          minLength: 1
          maxLength: 100
        action:
          type: string
          enum: [dismiss, remove_image, reset_username, block_user]
    ResolveReportsResult:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: integer
          description: Number of reports closed.
    OrphanedDataReport:
      type: object
      required: [counts, total]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Rows per table name.
        total:
          type: integer
    CleanupOrphanedDataInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true.
    DeleteAccountInput:
      type: object
      properties:
        password:
          type: string
          maxLength: 200
          description: Current password (accounts that have one).
        confirmEmail:
          type: string
          description: The account's email address (accounts without a password).
    RegisterInput:
      type: object
      required: [email, password, acceptTerms]
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
          maxLength: 200
        registrationCode:
          type: string
          description: >
            Shared invitation code. Only required when the server is configured
            with REGISTRATION_CODE.
        acceptTerms:
          type: boolean
          description: >
            Must be true: the user agrees to the Datenschutzerklärung and the
            Nutzungsbedingungen. Time and version are stored with the account.
        turnstileToken:
          type: string
          maxLength: 2048
          description: >
            Token from the Cloudflare Turnstile widget. Only required when the
            server is configured with TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY.

