<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5B44" />
    <meta name="description" content="Little Farming – deine App für Garten, Hof und Tiere. Scanne Wildpflanzen, Pilze und Insekten und erfahre sofort, ob sie für dich und deine Tiere sicher sind." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Little Farming</title>
    <script>
      // Darstellung (src/lib/theme.ts) before the first paint, so dark mode does not flash.
      try {
        var t = localStorage.getItem("lf-theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
