name: API-Code erzeugen

# Erzeugt den API-Client (React-Hooks) und die Zod-Schemas neu, sobald sich
# lib/api-spec/openapi.yaml auf einem Arbeitszweig ändert, und committet das
# Ergebnis auf denselben Zweig. Danach laufen Typecheck und Tests auf dem
# erzeugten Stand (ein Commit mit dem GITHUB_TOKEN startet keine weiteren
# Workflows, deshalb wird hier selbst geprüft).

on:
  push:
    branches-ignore: [main]
    paths: ["lib/api-spec/openapi.yaml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-placeholder-secret-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Code erzeugen
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts

      - name: Erzeugten Code committen
        run: |
          if git diff --quiet -- lib/api-client-react/src/generated lib/api-zod/src/generated; then
            echo "::notice::Erzeugter Code war schon aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add lib/api-client-react/src/generated lib/api-zod/src/generated
          git commit -m "API-Code aus openapi.yaml neu erzeugt"
          git push
          echo "::notice::Erzeugter Code wurde committet."

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests API-Server
        run: pnpm --filter @workspace/api-server run test

      - name: Tests App
        run: pnpm --filter @workspace/pflanzenscanner run test
