    OrphanedDataReport:
      type: object
      required: [counts, total]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Rows per table name.
        total:
          type: integer
    CleanupOrphanedDataInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true.
    DeleteAccountInput:
      type: object
      properties:
        password:
          type: string
          maxLength: 200
          description: Current password (accounts that have one).
        confirmEmail:
          type: string
          description: The account's email address (accounts without a password).
    RegisterInput:
      type: object
      required: [email, password, acceptTerms]
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
          maxLength: 200
        acceptTerms:
          type: boolean
          description: >
            Must be true: the user agrees to the Datenschutzerklärung and the
            Nutzungsbedingungen. Time and version are stored with the account.
        turnstileToken:
          type: string
          maxLength: 2048
          description: >
            Token from the Cloudflare Turnstile widget. Only required when the
            server is configured with TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY.

