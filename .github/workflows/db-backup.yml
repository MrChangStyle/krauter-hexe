name: Datenbank-Sicherung

# Tägliche, verschlüsselte Sicherung der Produktionsdatenbank (Neon).
#
# Warum: Der Neon-Gratis-Tarif hält nur wenige Stunden Verlauf. Krankenakten
# und Bestandsbuch-Einträge dürfen aber nicht verloren gehen.
#
# Das Repository ist öffentlich. Workflow-Artefakte können daher von anderen
# GitHub-Nutzern heruntergeladen werden. Die Sicherung wird deshalb IMMER mit
# BACKUP_PASSPHRASE verschlüsselt, bevor sie das Runner-System verlässt.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   NEON_DATABASE_URL  Verbindungs-URL der Produktionsdatenbank
#   BACKUP_PASSPHRASE  langes Zufallspasswort; sicher aufbewahren, ohne es
#                      lässt sich keine Sicherung wiederherstellen
#
# Wiederherstellen: siehe docs/datensicherung.md

on:
  schedule:
    # Täglich 02:17 UTC (04:17 Berlin im Sommer). Ungerade Minute, damit der
    # Lauf nicht mit den vielen Jobs zur vollen Stunde zusammenfällt.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Secrets prüfen
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::NEON_DATABASE_URL und BACKUP_PASSPHRASE müssen als Secrets gesetzt sein."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE ist zu kurz (mindestens 20 Zeichen)."
            exit 1
          fi

      - name: PostgreSQL-Client 18 installieren
        # pg_dump muss mindestens die Version des Servers haben (Neon: 18).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Sicherung erstellen und verschlüsseln
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump \
            --format=custom --no-owner --no-privileges \
            --dbname="$NEON_DATABASE_URL" \
            --file=backup.dump
          # Prüfen, dass die Sicherung lesbar ist, bevor sie verschlüsselt wird.
          /usr/lib/postgresql/18/bin/pg_restore --list backup.dump > inhalt.txt
          tables=$(grep -c "TABLE DATA" inhalt.txt || true)
          echo "Gesicherte Tabellen: $tables"
          if [ "$tables" -lt 5 ]; then
            echo "::error::Sicherung enthält ungewöhnlich wenige Tabellen ($tables)."
            exit 1
          fi
          printf '%s' "$BACKUP_PASSPHRASE" > .pass
          gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 \
            --passphrase-file .pass \
            --output "littlefarming-db-$stamp.dump.gpg" backup.dump
          # Unverschlüsselte Daten sofort entfernen.
          shred -u backup.dump .pass inhalt.txt
          ls -lh "littlefarming-db-$stamp.dump.gpg"

      - name: Verschlüsselte Sicherung ablegen
        uses: actions/upload-artifact@v4
        with:
          name: littlefarming-db-${{ env.STAMP }}
          path: littlefarming-db-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
