name: CI

# Typecheck und Tests für jeden Pull Request und jeden Push auf main.
# Die Integrationstests (*.integration.test.ts, u. a. die Datentrennung)
# laufen gegen ein frisches Postgres im Job; echte Schlüssel gibt es nicht,
# die Platzhalter unten erfüllen nur die Start-Prüfungen.

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      # Equal to DATABASE_URL: switches on the integration tests (they
      # truncate tables, so only ever a throwaway database).
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-placeholder-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Datenbank-Schema anlegen
        run: pnpm --filter @workspace/db run push-force

      - name: Tests API-Server
        # One file at a time: the integration tests share the database.
        run: pnpm --filter @workspace/api-server exec vitest run --no-file-parallelism

      - name: Tests App
        run: pnpm --filter @workspace/pflanzenscanner run test
