kind = "web"
previewPath = "/"
title = "Kräuter-Hexe"
version = "1.0.0"
id = "artifacts/pflanzenscanner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25180

[services.development]
run = "pnpm --filter @workspace/pflanzenscanner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pflanzenscanner", "run", "build" ]
serve = "static"
publicDir = "artifacts/pflanzenscanner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25180"
BASE_PATH = "/"
